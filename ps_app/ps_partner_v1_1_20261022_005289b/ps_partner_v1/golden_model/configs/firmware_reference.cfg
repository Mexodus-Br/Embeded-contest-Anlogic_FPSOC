# Original firmware reference configuration, NOT calibrated hardware parameters.
# Effective IK constants: baseline/robotGeometry.cpp::calculateGrad (constructor ignored).
base_radius_mm=83.7
effector_radius_mm=30.4
upper_length_mm=150
lower_length_mm=280
# baseline/config.h; RAMPS reference only, NOT final SERVO42C microsteps.
main_gear_teeth=4.5
motor_gear_teeth=1
microsteps=16
steps_per_rev=200
# Order is original motor X(high), Y(low), Z(rot); not confirmed M1/M2/M3 wiring.
# Explicit optional extension: add angle offset before multiply, integer offset after truncation.
# Original stepToPositionRad has NO such offsets; -0.48 is counter initialization only.
angle_offset_x_rad=0
angle_offset_y_rad=0
angle_offset_z_rad=0
step_offset_x=0
step_offset_y=0
step_offset_z=0
# Original inverse flags affect DIR only, never negate numerical targets.
inverse_x=1
inverse_y=1
inverse_z=1
# Arduino AVR int range used as reference guard, NOT a PS/PL interface width decision.
target_min=-32768
target_max=32767
# baseline/config.h + interpolation.cpp: Z_MAX check is commented out.
limit_x_mm=110
limit_y_mm=110
limit_z_min_mm=-300
